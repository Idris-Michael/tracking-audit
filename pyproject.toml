[project]
name = "tracking-audit"
version = "0.1.0"
description = "Pre-sales tracking audit: one clean page load, then a scorecard for GTM, GA4, Consent Mode v2 and Meta Pixel."
readme = "README.md"
authors = [{ name = "Idris-Michael Bakare" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "playwright>=1.55",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.9",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tracking-audit = "tracking_audit.cli:main"
ta-api = "tracking_audit.api:main"
ta-worker = "tracking_audit.worker:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is how pytest checks

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]  # test fixtures use literal secrets

[tool.mypy]
strict = true
packages = ["tracking_audit"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=tracking_audit --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: needs Docker (testcontainers Postgres)",
    "browser: launches headless Chromium",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "testcontainers[postgres]>=4.15.0",
]
